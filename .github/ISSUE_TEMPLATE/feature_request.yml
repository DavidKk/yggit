name: Feature Request
description: Suggest a new feature or enhancement for Yggit
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or problem would this feature help solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like this feature to work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any mockups, references, or extra details.
